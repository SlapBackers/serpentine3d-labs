name: Test against Serpentine3D

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"     # weekly: catch a Serpentine3D change that breaks a plugin

jobs:
  up-to-date:
    name: Plugins match their branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build.py --all --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        serpentine3d: ["v0.13.1", "main"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt/OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3
      - name: Install Serpentine3D ${{ matrix.serpentine3d }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest \
            "serpentine3d @ git+https://github.com/chisomobanzi/Serpentine3D@${{ matrix.serpentine3d }}"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
